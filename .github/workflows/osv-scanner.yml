name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR that touches a lockfile and on a weekly schedule
# against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the existing supply-chain-audit.yml workflow (which scans
# for malicious code patterns in PR diffs) by covering the orthogonal
# "currently-pinned dep became known-vulnerable" case.
#
# Uses Google's officially-recommended reusable workflow, pinned by SHA.
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln is disabled so the job does not block merges on pre-existing
# vulnerabilities in pinned deps that we may need to patch deliberately.

on:
  pull_request:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tui/package.json'
      - 'apps/desktop/package.json'
      - 'apps/bootstrap-installer/package.json'
      - 'apps/bootstrap-installer/src-tauri/Cargo.lock'
      - 'web/package.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
      - 'plugins/platforms/photon/sidecar/package-lock.json'
      - '.github/workflows/osv-scanner.yml'
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tui/package.json'
      - 'apps/desktop/package.json'
      - 'apps/bootstrap-installer/package.json'
      - 'apps/bootstrap-installer/src-tauri/Cargo.lock'
      - 'web/package.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
      - 'plugins/platforms/photon/sidecar/package-lock.json'
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # Required by the reusable workflow to upload SARIF to the Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install OSV-Scanner
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run OSV-Scanner
        run: |
          osv-scanner \
            --lockfile=uv.lock \
            --lockfile=package-lock.json \
            --lockfile=apps/bootstrap-installer/src-tauri/Cargo.lock \
            --lockfile=scripts/whatsapp-bridge/package-lock.json \
            --lockfile=plugins/platforms/photon/sidecar/package-lock.json \
            --format=table || true

      - name: Generate SARIF report
        run: |
          osv-scanner \
            --lockfile=uv.lock \
            --lockfile=package-lock.json \
            --lockfile=apps/bootstrap-installer/src-tauri/Cargo.lock \
            --lockfile=scripts/whatsapp-bridge/package-lock.json \
            --lockfile=plugins/platforms/photon/sidecar/package-lock.json \
            --format=sarif \
            --output=results.sarif || true

      # Code Scanning on a private repo needs GitHub Code Security, which is
      # not licensed (AIS-313): upload only while the repo is public, always
      # keep the report as an artifact.
      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        continue-on-error: true
        with:
          sarif_file: results.sarif

      - name: Keep the SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: osv-scanner-sarif
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 30
