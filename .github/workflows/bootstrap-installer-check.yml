# .github/workflows/bootstrap-installer-check.yml
#
# The Tauri bootstrap installer (apps/bootstrap-installer/src-tauri) is only
# compiled by the release workflow. This job type-checks and unit-tests the
# Rust crate on pull requests that touch it, so a broken installer does not
# surface for the first time during a release build (AIS-313).
name: Bootstrap installer (cargo)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/bootstrap-installer/**"
      - ".github/workflows/bootstrap-installer-check.yml"
  push:
    branches: [main]
    paths:
      - "apps/bootstrap-installer/**"
      - ".github/workflows/bootstrap-installer-check.yml"

permissions:
  contents: read

concurrency:
  group: bootstrap-installer-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      # tauri-build validates frontendDist (../dist) at build-script time; the
      # UI itself is type-checked by typecheck.yml, so an empty dist suffices.
      - name: Provide an empty frontend dist for tauri-build
        run: mkdir -p apps/bootstrap-installer/dist

      - name: cargo check
        env:
          HERMES_BUILD_PIN_TAG: v0.0.0-rc.1
          HERMES_BUILD_PIN_BRANCH: preview
        run: cargo check --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml

      - name: cargo test
        env:
          HERMES_BUILD_PIN_TAG: v0.0.0-rc.1
          HERMES_BUILD_PIN_BRANCH: preview
        run: cargo test --manifest-path apps/bootstrap-installer/src-tauri/Cargo.toml
