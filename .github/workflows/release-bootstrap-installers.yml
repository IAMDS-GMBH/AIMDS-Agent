name: Release Bootstrap Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version override (e.g. 0.1.0 or v0.1.0)"
        required: false
        type: string
      version_bump:
        description: "When version is empty: pick bump type (breaking=major)."
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - breaking
      base_url:
        description: "IAMDS ecosystem base URL baked into the installer for Keycloak SSO (e.g. https://suite.example.com). Leave empty for a generic build without a pre-configured endpoint."
        required: false
        type: string
      keycloak_realm:
        description: "Keycloak realm name for SSO (default: aimds). Only used when base_url is set."
        required: false
        default: aimds
        type: string
      create_release:
        description: "Create/update a GitHub Release and upload artifacts"
        required: false
        default: true
        type: boolean
      skip_signing:
        description: "Skip Apple code signing and notarization (useful when notarization API is unreachable)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  dispatch-from-tag:
    name: Re-dispatch build from tag push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # The signing/notarization job below authenticates to Azure via OIDC,
      # and the federated credential's subject is scoped to
      # `repo:<org>/<repo>:ref:refs/heads/main` (see the "Enforce main
      # workflow ref" step in build-installers). A tag push has a different
      # OIDC subject (`ref:refs/tags/v...`), which that credential would
      # reject. Rather than widen the Azure trust boundary, verify the tag
      # points at current main HEAD and re-dispatch this same workflow as a
      # normal workflow_dispatch run on main — the exact, already-trusted
      # path — with the version derived from the tag name.
      - name: Verify tag points at current main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "${{ github.sha }}" ]; then
            echo "::error::Tag '${{ github.ref_name }}' (${{ github.sha }}) does not point at current main HEAD ($main_sha). Only tag the latest main commit."
            exit 1
          fi

      - name: Resolve version from tag name
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid vX.Y.Z version tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch workflow_dispatch run on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release-bootstrap-installers.yml \
            --ref main \
            -f "version=$VERSION" \
            -f create_release=true

  build-installers:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, self-hosted-windows]

    steps:
      - name: Enforce main workflow ref (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Run workflow_dispatch from refs/heads/main so Azure OIDC subject matches main."
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main

      - name: Clean stale build output (self-hosted Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # self-hosted-windows is the only non-ephemeral runner in this
          # matrix — its workspace persists across runs, so leftover build
          # output from a previous (possibly failed or interrupted) run can
          # make an incremental Cargo/Tauri build silently stale or fail
          # outright (e.g. locked DLLs, a half-written bundle, or a junction
          # left behind by an older bootstrap-installer version). The
          # macOS leg runs on an ephemeral GitHub-hosted runner and always
          # starts from a clean checkout, so it needs no equivalent step.
          $target = "${{ github.workspace }}\apps\bootstrap-installer\src-tauri\target"
          if (Test-Path $target) {
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
            Write-Host "Removed stale target directory: $target"
          } else {
            Write-Host "No stale target directory found."
          }

      - name: Resolve installer version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            clean="${INPUT_VERSION#v}"
            if [[ ! "$clean" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '$INPUT_VERSION'. Use SemVer like 0.1.0 or v0.1.0"
              exit 1
            fi
            echo "installer_version=$clean" >> "$GITHUB_OUTPUT"
            echo "Using explicit version: $clean"
          else
            current="$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/ { print $2; exit }' pyproject.toml)"
            if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Current pyproject version '$current' is not x.y.z"
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$current"
            bump="${INPUT_BUMP:-patch}"
            case "$bump" in
              patch)   patch=$((patch + 1)) ;;
              minor)   minor=$((minor + 1)); patch=0 ;;
              major|breaking) major=$((major + 1)); minor=0; patch=0 ;;
              *)
                echo "::error::Invalid version_bump '$bump' (use patch|minor|major|breaking)"
                exit 1
                ;;
            esac
            next="${major}.${minor}.${patch}"
            echo "installer_version=$next" >> "$GITHUB_OUTPUT"
            echo "Using bumped version ($bump): $current -> $next"
          fi

      - name: Apply installer version override
        if: steps.version.outputs.installer_version != ''
        shell: bash
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.installer_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.INSTALLER_VERSION;
          if (!version) process.exit(0);

          const pkgPath = 'apps/bootstrap-installer/package.json';
          const tauriPath = 'apps/bootstrap-installer/src-tauri/tauri.conf.json';
          const cargoPath = 'apps/bootstrap-installer/src-tauri/Cargo.toml';
          const manifestPath = 'apps/bootstrap-installer/src-tauri/hermes-setup.manifest';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargo = fs.readFileSync(cargoPath, 'utf8')
            .replace(/^version\s*=\s*"[^"]+"/m, `version = "${version}"`);
          fs.writeFileSync(cargoPath, cargo);

          // NOTE: the manifest no longer contains a root <assemblyIdentity>
          // so there is no version field to update. Skipping manifest
          // version replacement avoids the regex accidentally matching
          // the <?xml version="1.0"?> declaration and corrupting it.
          // (Previously: .replace(/version="[0-9A-Za-z.+-]+"/m, ...) was
          // hitting the XML declaration's own version="1.0" attribute,
          // replacing it with e.g. version="0.0.8.0" — invalid XML that
          // made Windows SxS refuse to load the activation context.)

          console.log(`Applied installer version ${version}`);
          NODE

      - name: Validate install.ps1 syntax (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              "${{ github.workspace }}\scripts\install.ps1",
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            foreach ($err in $errors) {
              Write-Error ('install.ps1 syntax error - line {0} char {1}: {2}' -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message)
            }
            exit 1
          }
          $tokenCount = if ($tokens) { $tokens.Count } else { 0 }
          Write-Host ('install.ps1 syntax OK ({0} tokens)' -f $tokenCount)

      - name: Setup Node.js
        uses: actions/setup-node@v6 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri
          # Only cache the compiled `target/` dir on the ephemeral macOS
          # runner, where it can actually pay off. On self-hosted-windows
          # the "Clean stale build output" step above wipes `target/` on
          # every run regardless, so `target/` caching there only helps if
          # the network restore hits -- and CARGO_HOME (registry/git/bin)
          # already persists on that runner's local disk between runs
          # independent of this action, so a `target/`-cache miss buys
          # nothing but pays a multi-minute upload of ~500MB+ of dependency
          # build artifacts on every save. Keep caching just the registry
          # (small, fast) on Windows and skip the expensive target upload.
          cache-targets: ${{ runner.os != 'Windows' }}

      - name: Refresh Cargo Windows crates cache (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "CARGO_HOME_DIR=%CARGO_HOME%"
          if "%CARGO_HOME_DIR%"=="" set "CARGO_HOME_DIR=%USERPROFILE%\.cargo"

          for %%R in ("%CARGO_HOME_DIR%\registry\src" "%CARGO_HOME_DIR%\registry\cache") do (
            if exist "%%~R" (
              for /d %%I in ("%%~R\*") do (
                for /d %%P in ("%%~I\windows-sys-*") do rd /s /q "%%~P" 2>nul
                for /d %%P in ("%%~I\windows-targets-*") do rd /s /q "%%~P" 2>nul
              )
            )
          )

          set "MANIFEST=apps\bootstrap-installer\src-tauri\Cargo.toml"
          if exist "apps\bootstrap-installer\src-tauri\Cargo.lock" (
            cargo fetch --manifest-path "%MANIFEST%" --locked
          ) else (
            cargo fetch --manifest-path "%MANIFEST%"
          )

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync Python package version from release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.installer_version }}
        run: python scripts/set_version.py "$RELEASE_VERSION"

      - name: Resolve bootstrap pins (main latest + commit fallback)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_head="$(git rev-parse --verify origin/main^{commit})"
          echo "HERMES_BUILD_PIN_BRANCH=main" >> "$GITHUB_ENV"
          echo "HERMES_BUILD_PIN_COMMIT=$main_head" >> "$GITHUB_ENV"
          echo "Resolved pins: branch=main, commit=$main_head"

      - name: Export Apple signing credentials (macOS, skip_signing=false)
        if: runner.os == 'macOS' && inputs.skip_signing != true
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_CERTIFICATE=$_APPLE_CERTIFICATE"             >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$_APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$_APPLE_SIGNING_IDENTITY"   >> "$GITHUB_ENV"
          echo "APPLE_ID=$_APPLE_ID"                               >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$_APPLE_PASSWORD"                   >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID"                     >> "$GITHUB_ENV"
          echo "Apple signing credentials exported."

      - name: Build bootstrap installer
        env:
          VITE_DEFAULT_BASE_URL: ${{ github.event.inputs.base_url }}
          VITE_DEFAULT_KEYCLOAK_REALM: ${{ github.event.inputs.keycloak_realm || 'aimds' }}
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Install Azure CLI (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $azCmd = Get-Command az -ErrorAction SilentlyContinue
          if (-not $azCmd) {
            Write-Host "Azure CLI not found, installing..."
            Invoke-WebRequest -Uri https://aka.ms/installazurecliwindows -OutFile AzureCLI.msi
            Start-Process msiexec.exe -Wait -ArgumentList '/I AzureCLI.msi /quiet'
            Remove-Item AzureCLI.msi
            # Standard install path for Azure CLI MSI
            $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
            if (-not (Test-Path $azDir)) {
              $azDir = "C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin"
            }
            Write-Host "Adding $azDir to GITHUB_PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $azDir
            $env:PATH = "$azDir;$env:PATH"
            Write-Host "Azure CLI installed: $($env:PATH -split ';' | Where-Object { $_ -like '*CLI2*' })"
          } else {
            Write-Host "Azure CLI already present at: $($azCmd.Source)"
          }

      - name: Azure login (OIDC)
        id: azure_login
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer with Azure Artifact Signing
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && steps.azure_login.outcome == 'success'
        continue-on-error: true
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          # Sign both raw exe and bundled NSIS installer.
          files-folder: ${{ github.workspace }}\apps\bootstrap-installer\src-tauri\target\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn if Windows installer is unsigned
        if: runner.os == 'Windows' && (github.ref != 'refs/heads/main' || steps.azure_login.outcome != 'success')
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::warning::Skipping Azure signing on non-main ref (${GITHUB_REF}). Windows installer will be released unsigned."
          else
            echo "::warning::Azure login failed — Windows installer will be released unsigned."
          fi

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob
          dmg_files=(apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -gt 0 ]; then
            cp -v "${dmg_files[0]}" release-artifacts/HermesSetup.dmg
          else
            echo "No DMG artifact found under target/release/bundle/dmg"
            exit 1
          fi

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $candidates = @(
            "apps/bootstrap-installer/src-tauri/target/release/bundle/*/*.exe",
            "apps/bootstrap-installer/src-tauri/target/release/*.exe"
          )

          $files = @()
          foreach ($pattern in $candidates) {
            $files += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
          }

          $files = $files | Sort-Object FullName -Unique
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows .exe artifacts found under target/release"
          }

          $primary = $files[0]
          Copy-Item -Path $primary.FullName -Destination "release-artifacts\HermesSetup.exe" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-installer-${{ runner.os }}-${{ steps.version.outputs.installer_version || 'repo-version' }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release-assets:
    name: Publish Release Assets
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout main for release metadata/version commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            clean="${INPUT_VERSION#v}"
            if [[ ! "$clean" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '${INPUT_VERSION}'. Use SemVer like 0.1.0 or v0.1.0"
              exit 1
            fi
          else
            current="$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/ { print $2; exit }' pyproject.toml)"
            if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Current pyproject version '$current' is not x.y.z"
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$current"
            bump="${INPUT_BUMP:-patch}"
            case "$bump" in
              patch)   patch=$((patch + 1)) ;;
              minor)   minor=$((minor + 1)); patch=0 ;;
              major|breaking) major=$((major + 1)); minor=0; patch=0 ;;
              *)
                echo "::error::Invalid version_bump '$bump' (use patch|minor|major|breaking)"
                exit 1
                ;;
            esac
            clean="${major}.${minor}.${patch}"
          fi
          echo "version=$clean" >> "$GITHUB_OUTPUT"
          echo "tag=v$clean" >> "$GITHUB_OUTPUT"

      - name: Persist version bump in repository
        id: persist_version
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python scripts/set_version.py "$VERSION"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- \
            pyproject.toml \
            hermes_cli/__init__.py \
            apps/desktop/package.json \
            apps/bootstrap-installer/package.json \
            apps/bootstrap-installer/src-tauri/tauri.conf.json \
            apps/bootstrap-installer/src-tauri/Cargo.toml; then
            echo "Version files already up to date"
            exit 0
          fi
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git add \
            pyproject.toml \
            hermes_cli/__init__.py \
            apps/desktop/package.json \
            apps/bootstrap-installer/package.json \
            apps/bootstrap-installer/src-tauri/tauri.conf.json \
            apps/bootstrap-installer/src-tauri/Cargo.toml
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ steps.persist_version.outputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; setting as prerelease..."
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$TARGET_SHA" \
              --title "Bootstrap Installer $TAG" \
              --notes "Automated bootstrap installer release."
          fi

      - name: Generate release notes from commits (GitHub Models)
        id: ai_notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ steps.persist_version.outputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/bootstrap-release-notes.md"
          commits_file="$RUNNER_TEMP/bootstrap-release-commits.md"

          set +e
          prev_tag="$(gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq '.[] | .tagName' 2>/dev/null | awk -v cur="$TAG" '$0 != cur { print; exit }')"
          set -e

          build_commit_bullets() {
            local log_range="$1"
            local log_args=()
            if [ -n "$log_range" ]; then
              log_args+=("$log_range")
            else
              log_args+=(-n 40 "$TARGET_SHA")
            fi

            git log --no-merges --format='%H%x09%h%x09%s' "${log_args[@]}" | while IFS=$'\t' read -r sha short subject; do
              [ -n "${sha:-}" ] || continue

              login="$(gh api "repos/$GH_REPO/commits/$sha" --jq '.author.login // empty' 2>/dev/null || true)"

              if [ -z "${login:-}" ]; then
                email="$(git show -s --format='%ae' "$sha" 2>/dev/null || true)"
                local_part="${email%@*}"
                # Handle GitHub noreply addresses like 12345+login@users.noreply.github.com
                login="${local_part##*+}"
              fi

              # Mentions must be GitHub login-safe; strip unsupported chars.
              login="$(printf '%s' "${login:-unknown}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')"
              [ -n "$login" ] || login="unknown"

              printf -- '- `%s` %s (@%s)\n' "$short" "$subject" "$login"
            done
          }

          if [ -n "${prev_tag:-}" ] && git rev-parse -q --verify "${prev_tag}^{commit}" >/dev/null; then
            build_commit_bullets "${prev_tag}..${TARGET_SHA}" > "$commits_file"
            range_label="${prev_tag}...${TAG}"
          else
            build_commit_bullets "" > "$commits_file"
            range_label="up to ${TAG}"
          fi

          if [ ! -s "$commits_file" ]; then
            echo "- No commit metadata available." > "$commits_file"
          fi

          {
            echo "## Changes"
            echo
            echo "_Range: ${range_label}_"
            echo
            cat "$commits_file"
          } > "$notes_file"

          # Best-effort LLM summary via GitHub Models API.
          # Fallback is the raw commit bullets generated above.
          prompt_payload="$(jq -n \
            --arg range "$range_label" \
            --arg commits "$(cat "$commits_file")" \
            '{
              model: "gpt-4.1-mini",
              temperature: 0.2,
              messages: [
                {
                  role: "system",
                  content: "You write concise release notes in GitHub-flavored markdown. Group into short sections and keep only user-visible, meaningful changes. Avoid speculation."
                },
                {
                  role: "user",
                  content: ("Summarize these commits into release notes.\n\nRange: " + $range + "\n\nCommits:\n" + $commits)
                }
              ]
            }')"

          set +e
          ai_response="$(curl -sS -X POST "https://api.github.com/copilot/v1/chat/completions" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$prompt_payload")"
          curl_status=$?
          set -e

          if [ $curl_status -eq 0 ]; then
            ai_notes="$(jq -r '
              (.choices[0].message.content // "") as $c
              | if ($c|type) == "string" then $c
                elif ($c|type) == "array" then ($c | map(.text // .content // "") | join(""))
                else ""
                end
            ' <<<"$ai_response" 2>/dev/null || true)"
            if [ -n "${ai_notes:-}" ]; then
              {
                echo "$ai_notes"
                echo
                echo "---"
                echo
                echo "_Commit range: ${range_label}_"
              } > "$notes_file"
            else
              echo "::warning::GitHub Models response was empty; using commit bullets fallback."
            fi
          else
            echo "::warning::GitHub Models request failed; using commit bullets fallback."
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES_FILE: ${{ steps.ai_notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --prerelease --notes-file "$NOTES_FILE"

      - name: Download all installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/**/HermesSetup.dmg release-assets/**/HermesSetup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            files=(release-assets/**/*.dmg release-assets/**/*.exe)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
