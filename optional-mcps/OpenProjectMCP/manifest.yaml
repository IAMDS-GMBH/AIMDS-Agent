# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: OpenProjectMCP
description: >-
  Read and manage OpenProject Community Edition work packages and time
  entries: search, create, update (including moving between projects),
  delete, comment, relate and book time. Every write is preview-then-confirm;
  project scope is enforced by allowlists.
source: https://github.com/IAMDS-GMBH/AIMDS-Agent/tree/main/optional-mcps/OpenProjectMCP

# Registered names use the short prefix (`mcp_op_search_work_packages`)
# instead of `mcp_OpenProjectMCP_...` (AIS-327).
tool_prefix: op

transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/python"
  args:
    - "${INSTALL_DIR}/optional-mcps/OpenProjectMCP/server.py"

install:
  # AIS-408: the server ships inside this Hermes install; it replaced the
  # upstream openproject-ce-mcp (~150 tools, opaque "Error executing tool"
  # failures — SUP-20260924-073844).
  type: local
  path: optional-mcps/OpenProjectMCP
  bootstrap:
    - "python3 -m venv .venv"
    - ".venv/bin/pip install -r ${INSTALL_DIR}/optional-mcps/OpenProjectMCP/requirements.txt"
  verify_imports:
    - mcp
    - httpx
  # AIS-410: existing uvx installs of the upstream package are swapped for
  # this server on `hermes update`, keeping their env block and tool prefix.
  replaces:
    - "openproject-ce-mcp"

auth:
  type: api_key
  notes: >-
    Create the API token in OpenProject under My account -> Access tokens
    (+ API token, format opapi-...); an administrator must have enabled API
    tokens under Administration -> API and webhooks. OPENPROJECT_READ_PROJECTS
    "*" reads every project the token can see; leave OPENPROJECT_WRITE_PROJECTS
    empty for a read-only setup and list project identifiers (or "*") to allow
    writes there. Every write tool validates first and only executes when called
    again with confirm=true.
  env:
    - name: OPENPROJECT_BASE_URL
      prompt: "OpenProject URL (e.g. https://openproject.example.com)"
      required: true
      secret: false
    - name: OPENPROJECT_API_TOKEN
      prompt: "OpenProject API token (My account -> Access tokens, opapi-...)"
      required: true
      secret: true
    - name: OPENPROJECT_READ_PROJECTS
      prompt: "Readable projects: comma-separated identifiers/names/globs, or * for all visible"
      default: "*"
      required: false
      secret: false
    - name: OPENPROJECT_WRITE_PROJECTS
      # AIS-330: an empty value is a legitimate read-only setup; the server
      # then registers no write tools at all. Say so in the prompt.
      prompt: "Writable projects (identifiers, globs or * — EMPTY = read-only: no create/update/comment/time-booking tools will be available)"
      default: ""
      required: false
      secret: false

tools:
  default_enabled:
    - list_projects
    - project_context
    - search_work_packages
    - get_work_package
    - list_time_entries
    - create_work_package
    - update_work_package
    - delete_work_package
    - add_comment
    - manage_relation
    - log_time
  # AIS-410: tool names of the replaced openproject-ce-mcp. A replaced install
  # starts from default_enabled; these keep a hand-edited include list working.
  renamed:
    get_project_work_package_context: project_context
    list_work_packages: search_work_packages
    list_my_open_work_packages: search_work_packages
    get_work_packages: search_work_packages
    create_subtask: create_work_package
    add_work_package_comment: add_comment
    get_work_package_activities: get_work_package
    get_work_package_relations: get_work_package
    create_work_package_relation: manage_relation
    list_time_entry_activities: project_context
    create_time_entry: log_time
    update_time_entry: log_time
    list_types: project_context
    list_statuses: project_context
    list_priorities: project_context
    list_versions: project_context
  removed:
    - get_current_user
    - get_project
    - get_version
    - list_work_package_attachments
    - get_attachment_content
    - get_wiki_page
    - list_work_package_wiki_links
    - create_work_package_wiki_link
    - delete_work_package_wiki_link
    - list_boards
    - list_meetings
    - list_views
    - execute_query

post_install: |
  OpenProject MCP has been configured. Tools are registered as
  mcp_op_<tool> (e.g. mcp_op_search_work_packages).

  - Read scope comes from OPENPROJECT_READ_PROJECTS; writes stay disabled until
    OPENPROJECT_WRITE_PROJECTS lists projects (then restart Hermes). Without it
    the server registers NO create/update/comment/time-booking tools. Every
    write is preview-then-confirm.
  - Time tracking works like Jira + Tempo: log_time books on a work package
    (hours as 1.5 or '1h30m'); a confirmed booking is stored locally at once.
  - Display ids such as AIS-408 need OpenProject 17.5+ (semantic ids);
    numeric ids always work.

  Start a new Hermes session to load the OpenProject tools.
