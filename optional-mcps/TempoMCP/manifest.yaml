# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: TempoMCP
description: Tempo Timesheets integration for Jira Cloud & Server/DC (worklogs, time bookings, accounts, work attributes) using @ivelin-web/tempo-mcp-server.
source: https://github.com/ivelin-web/tempo-mcp-server

transport:
  type: stdio
  command: npx
  # Pinned exact version (see CONTRIBUTING.md#mcp-catalog-version-pinning-policy).
  # Unpinned npx installs whatever upstream currently tags "latest" on every
  # launch; bump deliberately. See .github/workflows/mcp-catalog-version-check.yml.
  args:
    - "-y"
    - "@ivelin-web/tempo-mcp-server@1.8.0"

auth:
  type: api_key
  notes: >-
    Separate credentials from AtlassianMCP (Tempo needs its own Jira context
    even if Jira MCP is already configured); if you leave these blank and
    AtlassianMCP is set up, Hermes auto-fills your Jira URL/email/token where
    possible. TEMPO_API_TOKEN always required.
  env:
    - name: TEMPO_API_TOKEN
      prompt: "Tempo API Token (from Tempo Timesheets Settings > API Tokens)"
      required: true
      secret: true
    - name: JIRA_BASE_URL
      prompt: "Jira Base URL (e.g. https://your-domain.atlassian.net)"
      required: true
      secret: false
    - name: JIRA_API_TOKEN
      prompt: "Jira API Token (Cloud) or Personal Access Token PAT (Server/DC)"
      required: true
      secret: true
    - name: JIRA_EMAIL
      prompt: "Jira User Email (required for Jira Cloud; leave blank for Server/DC)"
      required: false
      secret: false

tools:
  # One scheme only: the npx server advertises these camelCase names. The list
  # used to carry a snake_case variant of each as well, so five entries could
  # never match anything and every client logged them as "not advertised" on
  # every start (AIS-403). Two more (create_worklog, delete_worklog) stayed
  # quiet only because the alias matching folded them onto the camelCase twins
  # already listed here — redundant rather than correct.
  # The snake_case variants never matched anything the server offers; these
  # clear them out of configs written while they were still listed (AIS-405).
  # create_worklog and delete_worklog go too: they only ever resolved through
  # alias matching onto the camelCase entries below, so nothing is lost.
  removed:
    - get_worklogs
    - create_worklog
    - update_worklog
    - delete_worklog
    - get_user_schedule
    - missing_days_report
    - worklog_analytics
  default_enabled:
    - retrieveWorklogs
    - createWorklog
    - bulkCreateWorklogs
    - editWorklog
    - deleteWorklog
    - getMissingWorklogDays
    - getWorklogAnalytics

post_install: |
  Tempo MCP (@ivelin-web/tempo-mcp-server via npx) has been configured.

  Provides dedicated tools for Tempo Timesheets worklog creation, time bookings,
  timesheet retrieval, and work attribute reporting in Jira.
