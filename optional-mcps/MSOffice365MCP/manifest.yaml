# Nous-approved MCP catalog entry.
manifest_version: 1

name: MSOffice365MCP
disabled: false
description: Access Microsoft 365 services (Outlook Mail, Outlook Calendar, Teams, OneDrive, Directory/Users, Contacts, and SharePoint) via MS Graph API.
source: https://github.com/IAMDS-GMBH/hermes-agent/tree/main/optional-mcps/MSOffice365MCP

transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/python"
  args:
    - "${INSTALL_DIR}/optional-mcps/MSOffice365MCP/server.py"

install:
  type: git
  url: https://github.com/IAMDS-GMBH/AIMDS-Agent.git
  ref: main
  bootstrap:
    - "python3 -m venv .venv"
    - ".venv/bin/pip install -r ${INSTALL_DIR}/optional-mcps/MSOffice365MCP/requirements.txt"

auth:
  type: oauth
  provider: microsoft
  env_var: M365_ACCESS_TOKEN
  notes: >-
    ⚠️ WICHTIGER HINWEIS: Microsoft 365 erfordert den Abschluss des OAuth Device Flows vor der ersten Nutzung!
    Beide Felder unten sind OPTIONAL — standardmäßig leer lassen für die Standard-Multi-Tenant App
    (Client ID 41c29967-8ee6-4fac-b484-e87460272bda, Tenant "organizations").
    
    Authentifizierung einrichten:
    - Primär / Empfohlen (App & Dashboard): Unter **Einstellungen → Connected Accounts (OAuth)** den Eintrag **Microsoft 365 (OAuth)** verbinden und den angezeigten Code unter https://microsoft.com/devicelogin bestätigen.
    - Chat & Agent: Alternativ im Chat das Tool `m365_initiate_login` aufrufen.
    - CLI: Bei interaktiver Installation startet der Login automatisch, bzw. per `hermes auth add microsoft`.
    
    Erst nach erfolgreichem Login können die M365-Tools (Outlook Mail, Kalender, Teams, OneDrive) auf Daten zugreifen.
  # Mirrors server.py's BASE_SCOPES (non-admin default) so any device-code
  # login initiated outside of m365_initiate_login (e.g. the dashboard's
  # "Microsoft 365 (OAuth)" button, or `hermes mcp install MSOffice365MCP`)
  # requests the same permissions the MCP's tools actually need, instead of
  # falling back to a bare "User.Read". Admin-only scopes are intentionally
  # excluded here — those are only requested via
  # m365_initiate_login(request_admin_scopes=True).
  scopes:
    - User.Read
    - Mail.ReadWrite
    - Mail.Send
    - Calendars.ReadWrite
    - Chat.ReadWrite
    - Files.ReadWrite.All
    - Contacts.ReadWrite
    - Presence.Read
    - OnlineMeetings.Read
    - Tasks.ReadWrite
  env:
    - name: M365_CLIENT_ID
      prompt: "Microsoft Entra App Client ID (optional; leave blank to use default multi-tenant app)"
      required: false
      secret: false
    - name: M365_TENANT_ID
      prompt: "Microsoft Entra Tenant ID (default: common)"
      default: "common"
      required: false
      secret: false

tools:
  default_enabled:
    - m365_initiate_login
    - m365_complete_login
    - m365_get_user_profile
    - m365_check_admin_status
    - m365_generate_admin_consent_url
    - m365_search_users
    - m365_send_email
    - m365_list_emails
    - m365_get_email
    - m365_list_email_attachments
    - m365_download_email_attachment
    - m365_list_calendars
    - m365_get_events
    - m365_list_events
    - m365_create_event
    - m365_list_chats
    - m365_get_chat_members
    - m365_get_or_create_direct_chat
    - m365_send_chat_message
    - m365_list_contacts
    - m365_list_drive_files
    - m365_search_drive_files
    - m365_get_drive_file
    - m365_download_drive_file
    - m365_list_sharepoint_sites
    - m365_list_sharepoint_drives
    - m365_list_sharepoint_files
    - m365_search_sharepoint_files
    - m365_list_chat_messages
    - m365_list_joined_teams
    - m365_list_team_channels
    - m365_list_channel_messages
    - m365_list_teams_message_attachments
    - m365_download_teams_message_attachment
    - m365_get_activity_feed
    - m365_list_teams_calls
    - m365_get_user_presence
    - m365_get_schedule
    - m365_list_todo_tasks
    - m365_create_todo_task
    - m365_get_mailbox_settings

post_install: |
  Microsoft 365 MCP (m365) has been installed into your catalog.

  Authentication:
    - If installed from an interactive terminal, Hermes automatically started a
      Microsoft OAuth device-code login just now (enter the printed code at the
      printed URL to finish sign-in).
    - If M365_CLIENT_ID is provided, Hermes connects to your tenant's Entra App Registration.
    - Otherwise, Hermes connects via the default multi-tenant Microsoft app
      (Client ID 41c29967-8ee6-4fac-b484-e87460272bda) — no registration needed in your tenant.
    - Default sign-in requests only non-admin scopes (mail, calendar, chat, files, contacts).
      Tenant admins who also want directory-wide user search / SharePoint tools should call
      m365_initiate_login(request_admin_scopes=True) instead of setting M365_CLIENT_ID.
    - Didn't sign in during install (non-interactive install, or skipped)? Use the in-chat
      m365_initiate_login / m365_complete_login tools any time afterwards.
    - Token cache is automatically stored in ~/.hermes/m365_token_cache.bin.

  Supported Services:
    - User Directory (m365_search_users, m365_get_user_profile) — directory-wide search needs admin scopes.
    - Outlook Mail & Contacts (m365_send_email, m365_list_emails, m365_get_email, m365_list_contacts) — m365_send_email accepts local file paths via `attachments` (inline, ~3 MB limit).
    - Outlook Calendar (m365_list_events, m365_create_event)
    - Teams (m365_list_chats, m365_get_chat_members, m365_get_or_create_direct_chat, m365_send_chat_message) — m365_send_chat_message accepts local file paths via `attachments` (auto-uploaded to OneDrive and linked as a file card).
    - OneDrive & SharePoint (m365_list_drive_files, m365_search_drive_files, m365_get_drive_file, m365_list_sharepoint_sites, m365_list_sharepoint_drives, m365_list_sharepoint_files, m365_search_sharepoint_files) — SharePoint needs admin scopes.
