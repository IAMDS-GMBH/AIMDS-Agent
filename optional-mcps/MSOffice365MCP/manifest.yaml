# Nous-approved MCP catalog entry.
manifest_version: 1

name: MSOffice365MCP
disabled: false
description: Access Microsoft 365 services (Outlook Mail, Outlook Calendar, Teams, OneDrive, Directory/Users, Contacts, and SharePoint) via MS Graph API.
source: https://github.com/IAMDS-GMBH/hermes-agent/tree/main/optional-mcps/MSOffice365MCP

transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/python"
  args:
    - "${INSTALL_DIR}/optional-mcps/MSOffice365MCP/server.py"

install:
  type: git
  url: https://github.com/IAMDS-GMBH/AIMDS-Agent.git
  ref: main
  bootstrap:
    - "python3 -m venv .venv"
    - ".venv/bin/pip install -r ${INSTALL_DIR}/optional-mcps/MSOffice365MCP/requirements.txt"

auth:
  type: oauth
  provider: microsoft
  env_var: M365_ACCESS_TOKEN
  notes: >-
    Microsoft 365 requires a one-time OAuth device-code sign-in before first use.
    Both fields below are OPTIONAL. Leave them blank to use the built-in IAMDS
    multi-tenant app (client ID 41c29967-8ee6-4fac-b484-e87460272bda, tenant "organizations").

    Sign in (any tenant member, no admin needed):
    - App & Dashboard (recommended): Settings -> Providers -> Accounts -> "Microsoft 365 (OAuth)" -> Connect, then confirm the code at https://microsoft.com/devicelogin.
    - Chat: call the m365_initiate_login tool.
    - CLI: `hermes mcp install MSOffice365MCP` starts the sign-in automatically in an interactive terminal.

    The default sign-in requests only permissions every user can approve themselves (mail, calendar,
    contacts, files). Teams chat, presence, online meetings, shared mailboxes and To Do need a
    one-time approval by a tenant administrator: open "Grant for organization" on the Microsoft 365
    card (or call m365_generate_admin_consent_url) and hand the link to an admin. Nobody has to sign
    in again afterwards.
  # Self-consent tier (AIS-286) — mirrors hermes_cli.m365_auth.M365_LOGIN_SCOPES
  # and server.py's LOGIN_SCOPES; a test pins the three lists to each other.
  # Every login entry point (dashboard button, `hermes mcp install`, chat tool)
  # requests exactly this, so a non-admin never sees "Need admin approval".
  # Org-consent scopes (Chat.ReadWrite, Presence.Read, OnlineMeetings.Read,
  # Tasks.ReadWrite, *.Shared) arrive silently after tenant-admin consent.
  scopes:
    - User.Read
    - Mail.ReadWrite
    - Mail.Send
    - Calendars.ReadWrite
    - Contacts.ReadWrite
    - Files.ReadWrite.All
  env:
    - name: M365_CLIENT_ID
      prompt: "Microsoft Entra App Client ID (optional; leave blank to use default multi-tenant app)"
      required: false
      secret: false
    - name: M365_TENANT_ID
      prompt: "Microsoft Entra Tenant ID (optional; default: organizations)"
      default: "organizations"
      required: false
      secret: false

tools:
  default_enabled:
    - m365_initiate_login
    - m365_complete_login
    - m365_get_user_profile
    - m365_check_admin_status
    - m365_generate_admin_consent_url
    - m365_search_users
    - m365_send_email
    - m365_list_emails
    - m365_get_email
    - m365_list_email_attachments
    - m365_download_email_attachment
    - m365_list_calendars
    - m365_get_events
    - m365_list_events
    - m365_create_event
    - m365_list_chats
    - m365_find_chat
    - m365_get_chat_style
    - m365_get_chat_members
    - m365_get_or_create_direct_chat
    - m365_send_chat_message
    - m365_list_contacts
    - m365_list_drive_files
    - m365_search_drive_files
    - m365_get_drive_file
    - m365_download_drive_file
    - m365_list_sharepoint_sites
    - m365_list_sharepoint_drives
    - m365_list_sharepoint_files
    - m365_search_sharepoint_files
    - m365_list_chat_messages
    - m365_list_joined_teams
    - m365_list_team_channels
    - m365_list_channel_messages
    - m365_list_teams_message_attachments
    - m365_download_teams_message_attachment
    - m365_get_activity_feed
    - m365_list_teams_calls
    - m365_get_user_presence
    - m365_get_schedule
    - m365_list_todo_tasks
    - m365_create_todo_task
    - m365_get_mailbox_settings

post_install: |
  Microsoft 365 MCP (m365) has been installed into your catalog.

  Authentication:
    - If installed from an interactive terminal, Hermes automatically started a
      Microsoft OAuth device-code login just now (enter the printed code at the
      printed URL to finish sign-in).
    - If M365_CLIENT_ID is provided, Hermes connects to your tenant's Entra App Registration.
    - Otherwise, Hermes connects via the built-in IAMDS multi-tenant app
      (Client ID 41c29967-8ee6-4fac-b484-e87460272bda) — no registration needed in your tenant.
    - The default sign-in requests only self-consentable scopes (mail, calendar, contacts, files).
      Teams chat, presence, online meetings, shared mailboxes and To Do need a one-time
      tenant-admin consent: m365_generate_admin_consent_url (or "Grant for organization" on the
      Microsoft 365 card in Settings) gives you the link for an administrator. No re-login needed.
    - Tenant admins who also want directory-wide user search / SharePoint tools can call
      m365_initiate_login(scope_tier="admin").
    - Didn't sign in during install (non-interactive install, or skipped)? Use the in-chat
      m365_initiate_login / m365_complete_login tools any time afterwards.
    - Token cache is automatically stored in ~/.hermes/m365_token_cache.bin.

  Supported Services:
    - User Directory (m365_search_users, m365_get_user_profile) — directory-wide search needs the admin tier.
    - Outlook Mail & Contacts (m365_send_email, m365_list_emails, m365_get_email, m365_list_contacts) — m365_send_email accepts local file paths via `attachments` (inline, ~3 MB limit).
    - Outlook Calendar (m365_list_events, m365_create_event)
    - Teams (m365_find_chat, m365_send_chat_message(to=...), m365_get_chat_style, m365_list_chats, m365_get_chat_members, m365_get_or_create_direct_chat) — needs the org-consent tier; m365_send_chat_message resolves the recipient by name/email, renders Markdown to Teams HTML and accepts local file paths via `attachments` (auto-uploaded to OneDrive and linked as a file card).
    - OneDrive & SharePoint (m365_list_drive_files, m365_search_drive_files, m365_get_drive_file, m365_list_sharepoint_sites, m365_list_sharepoint_drives, m365_list_sharepoint_files, m365_search_sharepoint_files) — SharePoint needs the admin tier.
