# Nous-approved MCP catalog entry.
manifest_version: 1

name: MSOffice365MCP
disabled: false
description: Access Microsoft 365 services (Outlook Mail, Outlook Calendar, Teams, OneDrive, Directory/Users, Contacts, and SharePoint) via MS Graph API.
source: https://github.com/IAMDS-GMBH/hermes-agent/tree/main/optional-mcps/MSOffice365MCP

transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/python"
  args:
    - "${INSTALL_DIR}/server.py"

install:
  type: git
  url: https://github.com/IAMDS-GMBH/hermes-agent.git
  ref: main
  bootstrap:
    - "python3 -m venv .venv"
    - ".venv/bin/pip install -r ${INSTALL_DIR}/optional-mcps/MSOffice365MCP/requirements.txt"

auth:
  type: oauth
  provider: microsoft
  env_var: M365_ACCESS_TOKEN
  env:
    - name: M365_CLIENT_ID
      prompt: "Microsoft Entra App Client ID (optional; leave blank to use default multi-tenant app)"
      required: false
      secret: false
    - name: M365_TENANT_ID
      prompt: "Microsoft Entra Tenant ID (default: common)"
      default: "common"
      required: false
      secret: false

tools:
  default_enabled:
    - m365_initiate_login
    - m365_complete_login
    - m365_get_user_profile
    - m365_check_admin_status
    - m365_generate_admin_consent_url
    - m365_search_users
    - m365_send_email
    - m365_list_emails
    - m365_get_email
    - m365_list_events
    - m365_create_event
    - m365_list_chats
    - m365_get_chat_members
    - m365_get_or_create_direct_chat
    - m365_send_chat_message
    - m365_list_contacts
    - m365_list_drive_files
    - m365_search_drive_files
    - m365_get_drive_file
    - m365_list_sharepoint_sites
    - m365_list_sharepoint_drives
    - m365_list_sharepoint_files
    - m365_search_sharepoint_files

post_install: |
  Microsoft 365 MCP (m365) has been installed into your catalog.

  Authentication:
    - If M365_CLIENT_ID is provided, Hermes connects to your tenant's Entra App Registration.
    - Otherwise, Hermes connects via auto-discovery to common multi-tenant OAuth.
    - Token cache is automatically stored in ~/.hermes/m365_token_cache.bin.

  Supported Services:
    - User Directory (m365_search_users, m365_get_user_profile)
    - Outlook Mail & Contacts (m365_send_email, m365_list_emails, m365_get_email, m365_list_contacts)
    - Outlook Calendar (m365_list_events, m365_create_event)
    - Teams (m365_list_chats, m365_get_chat_members, m365_get_or_create_direct_chat, m365_send_chat_message)
    - OneDrive & SharePoint (m365_list_drive_files, m365_search_drive_files, m365_get_drive_file, m365_list_sharepoint_sites, m365_list_sharepoint_drives, m365_list_sharepoint_files, m365_search_sharepoint_files)
