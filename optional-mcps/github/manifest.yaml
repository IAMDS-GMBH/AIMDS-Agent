# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: GithubMCP
description: Access GitHub repositories, issues, pull requests, commits, and code using @modelcontextprotocol/server-github.
source: https://github.com/modelcontextprotocol/servers

transport:
  type: stdio
  command: "npx"
  # Pinned exact version (see CONTRIBUTING.md#mcp-catalog-version-pinning-policy).
  # NOTE: upstream marked this package "no longer supported" on npm and
  # moved development to github/github-mcp-server (a separate Go binary /
  # remote HTTP server, not an npm package) -- see the tracked follow-up to
  # migrate this catalog entry's transport. Pinning here only stops this
  # already-frozen package from silently changing under us in the meantime;
  # it is not a substitute for that migration.
  args:
    - "-y"
    - "@modelcontextprotocol/server-github@2025.4.8"

auth:
  type: oauth
  provider: github
  env_var: GITHUB_PERSONAL_ACCESS_TOKEN
  notes: >-
    Requires GitHub sign-in either way: leave the PAT blank to open an
    automatic OAuth device-code login in your browser right after install, or
    paste a PAT below to skip that login step.
  scopes:
    - repo
    - read:org
    - user
  env:
    - name: GITHUB_PERSONAL_ACCESS_TOKEN
      prompt: "GitHub PAT (optional; leave blank to authenticate via OAuth device code)"
      required: false
      secret: true

tools:
  default_enabled:
    - search_repositories
    - search_code
    - get_file_contents
    - list_issues
    - get_issue
    - create_issue
    - list_pull_requests
    - get_pull_request
    - create_pull_request

post_install: |
  GitHub MCP (@modelcontextprotocol/server-github via npx) has been configured.

  Authentication options:
    - Automatic / OAuth / OIDC / gh auth: Leave GITHUB_PERSONAL_ACCESS_TOKEN blank if authentication is handled via OAuth/OIDC or gh CLI env.
    - Personal Access Token (PAT): Optional token at https://github.com/settings/tokens (recommended scopes: `repo`, `read:org`, `user`).

  Start a new Hermes session to load the GitHub tools.
