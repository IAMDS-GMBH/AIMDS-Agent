# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: GithubMCP
description: >-
  Access GitHub repositories, issues, pull requests, commits, code, and
  GitHub Actions workflows/CI-CD runs using GitHub's official hosted remote
  MCP server.
source: https://github.com/github/github-mcp-server

# Previously ran @modelcontextprotocol/server-github via npx -- upstream
# marked that package "no longer supported" and moved development to
# github/github-mcp-server. That package also never had any GitHub
# Actions/workflow tools, at any version. Migrated to GitHub's own hosted
# remote MCP server: no local process/npx/Docker to install, keep pinned, or
# restart on every Hermes update, and it adds a full Actions/CI-CD toolset
# (list/get workflows & runs, trigger workflow_dispatch runs, download
# logs/artifacts) on top of everything the old tool list already covered.
#
# X-MCP-Toolsets combines the server's own "default" toolset (context, repos,
# issues, pull_requests, users) with "actions", so nothing users already had
# regresses. See https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md#optional-headers
transport:
  type: http
  url: https://api.githubcopilot.com/mcp/
  headers:
    X-MCP-Toolsets: "context,repos,issues,pull_requests,users,actions"

auth:
  type: oauth
  provider: github
  env_var: GITHUB_PERSONAL_ACCESS_TOKEN
  notes: >-
    ⚠️ WICHTIGER HINWEIS / IMPORTANT: Vor der Nutzung muss der OAuth Device Flow abgeschlossen oder ein PAT hinterlegt sein!
    
    Authentifizierung einrichten:
    - Option 1 (Empfohlen): In der CLI einmalig `hermes auth login github` (oder `gh auth login`) ausführen, um den OAuth Device Flow abzuschließen.
    - Option 2: Einen GitHub Personal Access Token (PAT mit Copilot/Repo-Berechtigungen) unten bei GITHUB_PERSONAL_ACCESS_TOKEN eintragen.
    
    Hinweis: GitHubs Remote-MCP-Server unterstützt keine dynamische Client-Registrierung; ohne vorherigen Login oder PAT schlägt die Verbindung mit einem 404-Fehler fehl.
  scopes:
    - repo
    - read:org
    - user
  env:
    - name: GITHUB_PERSONAL_ACCESS_TOKEN
      prompt: "GitHub PAT (optional; leave blank to authenticate via OAuth device code)"
      required: false
      secret: true

tools:
  default_enabled:
    - search_repositories
    - search_code
    - get_file_contents
    - list_issues
    - get_issue
    - create_issue
    - list_pull_requests
    - get_pull_request
    - create_pull_request
    - actions_list
    - actions_get
    - actions_run_trigger

post_install: |
  GitHub MCP now runs on GitHub's official hosted remote server
  (https://api.githubcopilot.com/mcp/) instead of the old, no-longer-supported
  @modelcontextprotocol/server-github npm package -- no local process to
  install, pin, or keep alive. This also adds full GitHub Actions/CI-CD
  support: list workflows and runs, inspect a run's jobs/logs/artifacts, and
  trigger a workflow_dispatch run.

  Authentication options:
    - Automatic: Leave GITHUB_PERSONAL_ACCESS_TOKEN blank to open a GitHub
      OAuth device-code login in your browser right after install.
    - Personal Access Token (PAT): Optional token at
      https://github.com/settings/tokens (recommended scopes: `repo`,
      `read:org`, `user`).

  Start a new Hermes session to load the GitHub tools.
