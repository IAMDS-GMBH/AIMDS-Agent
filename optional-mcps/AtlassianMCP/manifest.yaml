# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: AtlassianMCP
description: Access and manage Jira Cloud and Local (Data Center/Server) issues, projects, sprints, worklogs, and SLAs using mcp-atlassian.
source: https://github.com/sooperset/mcp-atlassian

transport:
  type: stdio
  command: "uvx"
  # Pinned exact version (see CONTRIBUTING.md#mcp-catalog-version-pinning-policy).
  # Unpinned uvx/npx MCP commands silently install upstream's *latest* on
  # every launch, so a breaking change (or, for mcp-atlassian specifically,
  # its documented upcoming TOOLSETS-default change) can break tool
  # discovery for every user overnight with no corresponding hermes-agent
  # change to bisect. Bump deliberately; see .github/workflows/mcp-catalog-version-check.yml.
  args:
    - "mcp-atlassian==0.23.0"

auth:
  type: api_key
  notes: >-
    Choose ONE auth mode, not both: Jira Cloud -> fill JIRA_API_TOKEN + JIRA_USERNAME
    and leave JIRA_PERSONAL_TOKEN blank. Jira Local/Data Center/Server -> fill
    JIRA_PERSONAL_TOKEN and leave JIRA_API_TOKEN + JIRA_USERNAME blank -- Server/DC
    instances often reject Basic Auth (JIRA_API_TOKEN + JIRA_USERNAME) entirely,
    which mcp-atlassian surfaces as a confusing "Unexpected return value type from
    `jira.jql`" error instead of a clear auth failure. JIRA_URL is always required.
  env:
    - name: JIRA_URL
      prompt: "Jira instance URL (e.g. https://your-domain.atlassian.net or https://jira.company.com)"
      required: true
      secret: false
    - name: JIRA_API_TOKEN
      prompt: "Jira API Token (Cloud only -- leave blank for Local/Data Center)"
      required: true
      secret: true
    - name: JIRA_USERNAME
      prompt: "Jira Username or Email (required for Cloud API Token; leave blank for Local/Data Center)"
      required: false
      secret: false
    - name: JIRA_PERSONAL_TOKEN
      prompt: "Jira Personal Access Token (for Local/Data Center Jira; leave blank if using JIRA_API_TOKEN)"
      required: false
      secret: true

tools:
  default_enabled:
    - jira_search
    - jira_get_issue
    - jira_create_issue
    - jira_update_issue
    - jira_add_comment
    - jira_add_worklog
    - jira_get_worklog
    - jira_get_issue_sla
    - jira_get_transitions
    - jira_transition_issue

post_install: |
  Jira MCP (mcp-atlassian via uvx) has been configured.

  Authentication modes:
    - Jira Cloud (Default): Set JIRA_URL, JIRA_API_TOKEN, and JIRA_USERNAME (your Atlassian email).
    - Jira Local / Data Center / Server: Set JIRA_URL and JIRA_PERSONAL_TOKEN (Personal Access Token,
      generated from your Jira profile's Personal Access Tokens page). Don't use JIRA_API_TOKEN +
      JIRA_USERNAME here -- many Server/DC instances have Basic Auth disabled, which fails with a
      confusing "Unexpected return value type from `jira.jql`" error instead of a clear auth error.

  Time Tracking & Worklog tools included:
    - jira_add_worklog: Log time spent on issues.
    - jira_get_worklog: Retrieve time tracking entries.
    - jira_get_issue_sla: Calculate SLA metrics and status durations.

  Start a new Hermes session to load the Jira tools.
